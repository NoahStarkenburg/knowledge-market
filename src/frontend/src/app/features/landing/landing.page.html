    <a [routerLink]="['/courses', course().id]" [class]="cardBase + ' ' + (highlight() ? 'bg-cobalt text-white' : 'bg-chalk text-ink')">
      <div class="flex items-center justify-between mb-5">
        <span class="t-label" [class]="metaTone()">No. {{ (index() + 1).toString().padStart(2, '0') }}</span>
        <span class="t-label" [class]="metaTone()">{{ course().tags?.[0] ?? 'General' }}</span>
      </div>
      <h3 class="font-display font-bold uppercase tracking-[-0.01em] text-[24px] leading-[0.98] mb-3">{{ course().title }}</h3>
      @if (course().description) {
        <p class="text-[14px] leading-[1.55] line-clamp-3 mb-6 flex-1" [class]="highlight() ? 'text-white/85' : 'text-ink-soft'">{{ course().description }}</p>
      }
      <div class="flex items-end justify-between pt-4 border-t-2 mt-auto" [class]="highlight() ? 'border-white/30' : 'border-ink'">
        <span class="t-label" [class]="metaTone()">{{ course().priceAmount === 0 ? 'Included' : 'One-time' }}</span>
        <span class="font-display font-extrabold text-[26px] tabular-nums tracking-[-0.01em]" [class]="highlight() ? 'text-signal' : 'text-cobalt'">{{ price() }}</span>
      </div>
    </a>
