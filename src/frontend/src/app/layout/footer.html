    <footer class="bg-paper border-t-2 border-ink mt-auto">
      <div class="max-w-[1320px] mx-auto px-5 sm:px-6 py-12">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-8 mb-12">
          @for (col of columns; track col.label) {
            <div>
              <div class="t-label text-ink mb-4 pb-2 border-b-2 border-ink">{{ col.label }}</div>
              <ul class="space-y-2.5">
                @for (l of col.links; track l.to + l.text) {
                  <li>
                    <a [routerLink]="l.to" [queryParams]="l.params ?? null" class="text-[14px] text-ink-soft hover:text-cobalt transition-colors">{{ l.text }}</a>
                  </li>
                }
              </ul>
            </div>
          }
        </div>

        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 pt-6 border-t-2 border-ink">
          <div>
            <a routerLink="/" class="inline-flex items-center gap-2.5">
              <app-ornament [size]="16" class="text-cobalt" />
              <span class="font-display font-extrabold uppercase tracking-[-0.01em] text-[20px] leading-none">
                <span class="text-ink">Knowledge</span><span class="text-cobalt">Market</span>
              </span>
            </a>
            <p class="t-label text-ink-mute mt-3">Vol. 01 / No. {{ volume }}</p>
          </div>
          <p class="font-mono uppercase tracking-[0.12em] text-[11px] text-ink-mute">&copy; {{ year }} KnowledgeMarket. All rights reserved.</p>
        </div>
      </div>
    </footer>
