    <div class="p-6 md:p-8">
      <div class="flex items-start justify-between gap-4 mb-8">
        <div class="min-w-0">
          <div class="t-eyebrow text-cobalt mb-3">Your catalog</div>
          <h1 class="font-display display-x font-extrabold uppercase leading-[0.9] tracking-[-0.03em] text-ink text-[clamp(2.5rem,7vw,4rem)]">Creator Studio</h1>
          <p class="text-[14px] text-ink-soft mt-4 max-w-[60ch]">Manage the courses you've created.</p>
        </div>
        <div class="shrink-0"><button appButton (click)="router.navigate(['/courses/new'])">New Course</button></div>
      </div>

      <app-form-error-list [error]="error()" />

      @if (loading()) {
        <div class="flex justify-center py-16"><app-loading-spinner /></div>
      } @else if (courses().length === 0 && !error()) {
        <div class="border-y-2 border-ink py-16 text-center">
          <div class="font-display display-x font-extrabold text-[56px] leading-none text-ink mb-3">00</div>
          <p class="font-display font-bold uppercase tracking-[-0.01em] text-[20px] text-ink mb-2">No courses created yet</p>
          <p class="text-[14px] text-ink-mute mb-6">Share your knowledge by creating your first course.</p>
          <a routerLink="/courses/new" class="inline-flex t-label bg-ink text-paper border-2 border-ink px-5 py-2.5 shadow-hard-sm hover:bg-cobalt hover:border-cobalt hover:text-white active:translate-x-[3px] active:translate-y-[3px] active:shadow-none transition-[background-color,color,border-color,transform,box-shadow] duration-100">Create your first course</a>
        </div>
      } @else {
        <div class="grid md:grid-cols-2 gap-5">
          @for (c of courses(); track c.id) {
            <button class="group text-left panel p-5 transition-[transform,box-shadow] duration-100 hover:-translate-x-[3px] hover:-translate-y-[3px] hover:shadow-hard" (click)="router.navigate(['/courses', c.id])">
              <div class="mb-3"><span class="t-micro" [class]="c.status === 'Published' ? 'text-[#1b5e34]' : 'text-cobalt'">{{ c.status }}</span></div>
              <div class="font-display font-bold text-[18px] tracking-[-0.01em] text-ink mb-2 line-clamp-2">{{ c.title }}</div>
              <div class="font-display font-extrabold text-[20px] tabular-nums tracking-[-0.01em] text-cobalt">{{ c.priceAmount === 0 ? 'Free' : '$' + c.priceAmount }}</div>
              @if (c.tags.length > 0) {
                <div class="flex flex-wrap gap-x-3 gap-y-1 mt-3">
                  @for (tag of c.tags.slice(0, 3); track tag) { <span class="t-micro text-ink-mute">{{ tag }}</span> }
                </div>
              }
            </button>
          }
        </div>
      }
    </div>
