# Continuous Integration: build and test everything on every pull request.
#
# The point is that this runs whether or not anyone remembers to. Tests you
# have to remember to run are tests that eventually do not get run.

name: CI

on:
  # Run on PRs targeting main. This is the one that matters: it tells you
  # whether merging would break main, before you merge.
  pull_request:
    branches: [main]
  # Also run on main itself, so a broken merge is caught immediately rather
  # than by whoever opens the next PR.
  push:
    branches: [main]

# Least privilege. The default token can write to the repo; these jobs only
# need to read it. Narrow this by default and widen only when a job needs it.
permissions:
  contents: read

# If you push twice to the same PR, cancel the first run. Without this you
# burn Actions minutes finishing a run whose result you no longer care about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    # A hung job otherwise runs until GitHub's 6 hour default. On a private
    # repo that eats the monthly minute budget.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          # No NuGet caching: setup-dotnet's cache keys off packages.lock.json,
          # and this solution does not use NuGet lock files. Adding them
          # (RestorePackagesWithLockFile) would make restores reproducible and
          # cacheable, but that is a separate change from setting up CI.

      - name: Restore
        run: dotnet restore KnowledgeMarket.sln

      # --no-restore because the previous step already did it. Running restore
      # implicitly again is wasted time and can mask a broken restore step.
      - name: Build
        run: dotnet build KnowledgeMarket.sln --configuration Release --no-restore

      # The integration tests use Testcontainers, which starts a real SQL Server
      # container per run. ubuntu-latest ships with Docker, so no service
      # container is needed here: the tests manage their own database.
      - name: Test
        run: dotnet test KnowledgeMarket.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      # npm ci, not npm install. ci installs exactly what package-lock.json
      # specifies and fails if package.json and the lockfile disagree. install
      # will happily resolve something new, which means CI could pass against
      # different versions than a developer ran locally.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
