# Load any dashboard JSON in this folder automatically.
apiVersion: 1
providers:
  - name: KnowledgeMarket
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
