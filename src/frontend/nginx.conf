# nginx site config for the SPA. Copied to /etc/nginx/conf.d/default.conf.
#
# Three jobs:
#   1. serve the built files off local disk
#   2. forward /api/ to the API container
#   3. set cache headers telling the BROWSER how long to keep each file
#
# nginx stores nothing itself. Caching here means response headers, not a cache
# on this server. A CDN later adds the second kind, keeping its own copies at
# edge locations, and reads these same headers to decide for how long.

server {
    # 8080, not 80: ports below 1024 need root, and this container is not root.
    listen 8080;
    server_name _;

    # Where the files from `COPY --from=build` live inside this image.
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers.
    #
    # nginx gotcha worth knowing: add_header is inherited by a location block
    # ONLY if that block declares no add_header of its own. The blocks below
    # that set Cache-Control therefore lose these and re-declare what matters.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fixed response for the container HEALTHCHECK and any orchestrator probe.
    # Deliberately not the app shell, so a probe stays cheap and unambiguous.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ----- the API ---------------------------------------------------------
    # Everything under /api/ is forwarded to the API container. "api" is the
    # service name from docker-compose.yml; compose runs a DNS server on its
    # network so containers find each other by name, the same way the
    # connection string reaches SQL Server as "mssql".
    location /api/ {
        # Resolve the upstream on every request rather than once at startup.
        #
        # With a literal `proxy_pass http://api:8080`, nginx resolves "api" when
        # it loads the config and then caches that IP for the life of the
        # process. Two consequences, both bad:
        #   1. nginx refuses to START if the api container is not up yet
        #      ("host not found in upstream"), so container order matters
        #   2. if the api container restarts with a new IP, nginx keeps using
        #      the old one and every request 502s until nginx restarts
        # The second is a classic outage in any environment where containers
        # move — Kubernetes reschedules pods constantly.
        #
        # Putting the host in a variable defers resolution to request time.
        # 127.0.0.11 is Docker's embedded DNS server, present on every
        # user-defined network, which is what compose creates.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream "api:8080";

        # No path component after the variable, so the original request URI is
        # forwarded intact: /api/courses -> http://api:8080/api/courses.
        # Adding a trailing slash here would strip the /api prefix and 404.
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;

        # The API sees nginx as its client, so without these it logs nginx's
        # container IP for every request and cannot build correct absolute
        # URLs. X-Forwarded-For is also what any IP-based rate limiting needs
        # in order to see the real caller.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No proxy_cache. API responses are per-user and authenticated; caching
        # one would eventually serve one user's data to another.
    }

    # ----- hashed assets ---------------------------------------------------
    # Vite names these from a hash of their contents, so index-D1SKo0fw.js can
    # never return different bytes — change the file and the NAME changes.
    # That makes a one-year cache safe: there is no such thing as a stale
    # response, only a filename that no longer exists.
    #
    # `immutable` additionally tells the browser not to revalidate on reload.
    location /assets/ {
        # Set Cache-Control once, explicitly. Using nginx's `expires 1y`
        # directive as well would emit a SECOND Cache-Control header; browsers
        # merge them, but two headers saying the same thing is noise.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-declared because the add_header above suppressed inheritance, and
        # nosniff genuinely matters for scripts and stylesheets.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ----- the app shell ---------------------------------------------------
    # index.html names which hashed files to load. Cache it and a deploy leaves
    # browsers asking for an asset that no longer exists — a blank page until
    # the cache expires. no-cache does not mean "do not store"; it means "ask
    # before reusing", which is a cheap 304 and always correct.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ----- everything else -------------------------------------------------
    # The SPA fallback. React Router invents URLs like /courses/abc-123 that
    # match no file on disk, so a hard refresh would 404. try_files says: try
    # it as a file, then as a directory, then give up and serve index.html —
    # which boots the app, which reads the URL and renders the right page.
    #
    # This is the exact rule ASP.NET spells MapFallbackToFile("index.html").
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Text compresses roughly 3-4x. Below ~1KB the header overhead is not worth
    # it. Images and fonts are already compressed, so they are left alone.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
