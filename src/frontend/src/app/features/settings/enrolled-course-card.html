    <div class="group flex flex-col panel transition-[transform,box-shadow] duration-100 hover:-translate-x-[3px] hover:-translate-y-[3px] hover:shadow-hard">
      <div class="h-32 flex items-center justify-center overflow-hidden border-b-2 border-ink {{ tone() }}">
        @if (course().thumbnailFileId) {
          <img [src]="api.getCourseThumbnailUrl(course().id)" alt="" class="w-full h-full object-cover" />
        } @else {
          <span class="font-display display-x font-extrabold text-[52px] leading-none tracking-[-0.03em] text-white/95">{{ (course().title[0] ?? 'C').toUpperCase() }}</span>
        }
      </div>
      <div class="flex flex-col p-5 flex-1">
        @if (course().tags.length > 0) {
          <div class="flex flex-wrap gap-x-3 gap-y-1 mb-3">
            @for (tag of course().tags; track tag) { <span class="t-micro text-ink-mute">{{ tag }}</span> }
          </div>
        }
        <a [routerLink]="['/courses', course().id, 'lessons']" class="font-display font-bold leading-[1.05] tracking-[-0.01em] text-[20px] text-ink line-clamp-2 group-hover:text-cobalt transition-colors">{{ course().title }}</a>
        <div class="mt-auto pt-5">
          <div class="flex justify-between t-micro text-ink-mute mb-1.5">
            <span>{{ entry().completedCount }} / {{ entry().totalLessons }} lessons</span>
            <span class="text-cobalt">{{ entry().progressPct }}%</span>
          </div>
          <div class="bg-paper-dim border-2 border-ink h-3 w-full"><div class="bg-cobalt h-full" [style.width.%]="entry().progressPct"></div></div>
        </div>
      </div>
    </div>
